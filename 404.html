<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Leo Lee</title>
  <meta name="description" content="页面未找到">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Noto+Serif:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-num {
      font-family: 'Noto Serif', Georgia, serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    .error-msg {
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-secondary);
      margin-bottom: 3rem;
      line-height: 2;
    }
    .error-back {
      font-family: 'Noto Serif', Georgia, serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    .error-back:hover {
      color: var(--black);
      border-color: var(--black);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-num">404</div>
    <p class="error-msg">
      页面在光与影之间迷失了方向。<br>
      你所寻找的页面不存在，或已被移到别处。
    </p>
    <a href="https://lqy306.github.io/" class="error-back">← 返回首页</a>
  </div>
</body>
</html>
