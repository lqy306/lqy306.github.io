<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Leo Lee</title>
    <meta name="description" content="页面未找到">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'F1.8';
            src: url('/fonts/F1.8-Regular.woff2') format('woff2'),
                 url('/fonts/F1.8-Regular.otf') format('opentype');
            font-display: swap;
        }

        @font-face {
            font-family: 'ChillRoundGothic';
            src: url('/fonts/ChillRoundGothic_Bold.woff2') format('woff2');
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'F1.8', 'ChillRoundGothic', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 28px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo {
            text-decoration: none;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            line-height: 1.2;
        }

        .logo .name {
            font-size: 1.15rem;
            font-weight: 700;
            display: block;
        }

        .logo .tag {
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.6;
            letter-spacing: 0.3em;
            display: block;
            margin-top: 2px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 2rem;
        }

        .error-page {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #fff;
            line-height: 1;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
        }

        .error-title {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ccc;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.2s;
        }

        .error-text {
            font-size: 0.95rem;
            color: #777;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
            line-height: 1.8;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.4s;
        }

        .error-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.6s;
        }

        .error-link {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            border: 1px solid #333;
            color: #ccc;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .error-link:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            letter-spacing: 0.35em;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            padding: 30px 40px;
            border-top: 1px solid #1a1a1a;
            text-align: center;
        }

        footer p {
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        footer a {
            color: #666;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover { color: #fff; }

        @media (max-width: 768px) {
            nav { padding: 20px 24px; }
            .error-links { flex-direction: column; gap: 1rem; }
            .error-link { padding: 0.8rem 1.8rem; }
            footer { padding: 24px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="https://lqy306.github.io" class="logo">
            <span class="name">Leo Lee</span>
            <span class="tag">Photography</span>
        </a>
    </nav>

    <main>
        <div class="error-page">
            <div class="error-code">404</div>
            <h1 class="error-title">Not Found</h1>
            <p class="error-text">
                你寻找的画面迷失在暗房里了。<br>
                也许它从未被显影，也许它已被时光褪去。
            </p>
            <div class="error-links">
                <a href="https://lqy306.github.io/" class="error-link">回到首页</a>
                <a href="https://lqy306.github.io/#gallery" class="error-link">浏览作品</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Leo Lee · Built with Arch Linux spirit &amp; <a href="https://archlinux.org" target="_blank">minimalism</a></p>
    </footer>

</body>
</html>
