<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Leo Lee</title>
    <meta name="description" content="页面未找到">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'F1.8';
            src: url('/fonts/F1.8-Regular.woff2') format('woff2'),
                 url('/fonts/F1.8-Regular.otf') format('opentype');
            font-display: swap;
        }
        @font-face {
            font-family: 'ChillRoundGothic';
            src: url('/fonts/ChillRoundGothic_Bold.woff2') format('woff2');
            font-display: swap;
        }
        @font-face {
            font-family: 'VonwaonBitmap';
            src: url('/fonts/VonwaonBitmap-16pxLite.woff2') format('woff2');
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #000000;
            --paper: #f2efe9;
            --paper-dark: #e8e4dc;
            --accent-red: #c41e3a;
            --text-dark: #111;
            --text-mid: #444;
            --text-light: #888;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'F1.8', 'ChillRoundGothic', sans-serif;
            background: var(--ink);
            color: var(--paper);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--ink);
            border-bottom: 3px solid var(--ink);
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.7rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'F1.8', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--paper);
            text-decoration: none;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent-red); }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }
        .nav-links a {
            color: var(--paper);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }
        .nav-links a:hover { color: var(--accent-red); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .error-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('photos/黑白-街头/奔跑.jpg');
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) contrast(1.3) brightness(0.3);
            opacity: 0.4;
        }

        .error-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 700px;
        }

        .error-number {
            font-family: 'F1.8', sans-serif;
            font-size: clamp(8rem, 25vw, 18rem);
            font-weight: 900;
            line-height: 0.8;
            color: var(--paper);
            letter-spacing: -0.05em;
            position: relative;
        }
        .error-number span {
            color: var(--accent-red);
        }

        .error-label {
            font-family: 'VonwaonBitmap', monospace;
            font-size: 0.8rem;
            color: var(--accent-red);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .error-label::before,
        .error-label::after {
            content: '';
            width: 40px;
            height: 1px;
            background: var(--accent-red);
        }

        .error-title {
            font-family: 'F1.8', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 900;
            color: var(--paper);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .error-text {
            font-size: 1rem;
            color: rgba(242,239,233,0.6);
            line-height: 1.8;
            margin-bottom: 3rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 2rem;
            font-family: 'F1.8', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            border: 2px solid var(--paper);
            color: var(--paper);
            background: transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn:hover {
            background: var(--paper);
            color: var(--ink);
        }
        .btn.primary {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: var(--paper);
        }
        .btn.primary:hover {
            background: transparent;
            color: var(--accent-red);
        }

        footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(242,239,233,0.1);
            position: relative;
            z-index: 2;
        }
        .footer-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'VonwaonBitmap', monospace;
            font-size: 0.7rem;
            color: rgba(242,239,233,0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        footer a {
            color: var(--accent-red);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .nav-container { padding: 0.7rem 1.2rem; }
            .error-label { font-size: 0.7rem; }
            .error-actions { flex-direction: column; align-items: center; }
            .btn { width: 100%; justify-content: center; max-width: 280px; }
            .footer-inner { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="https://lqy306.github.io" class="logo">Leo <span>Lee</span></a>
            <ul class="nav-links">
                <li><a href="https://lqy306.github.io">首页 / Home</a></li>
                <li><a href="https://github.com/lqy306" target="_blank">GitHub</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="error-bg"></div>
        <div class="error-content">
            <div class="error-label">Lost in the city / 迷失在城市中</div>
            <h1 class="error-number">4<span>0</span>4</h1>
            <h2 class="error-title">页面走丢了</h2>
            <p class="error-text">
                就像街头那些转瞬即逝的瞬间，这个页面也消失在了城市的褶皱里。<br>
                也许它从未存在过，也许它只是模糊了焦点。
            </p>
            <div class="error-actions">
                <a href="https://lqy306.github.io/" class="btn primary">
                    <i class="fas fa-home"></i>
                    返回首页
                </a>
                <a href="https://lqy306.github.io/#gallery" class="btn">
                    <i class="fas fa-camera"></i>
                    浏览作品
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <span>&copy; 2026 Leo Lee</span>
            <span>Are-Bure-Boke aesthetic / あ・ぶれ・ぼけ</span>
        </div>
    </footer>

</body>
</html>
