name: Sync LUTCalCh to GitHub Pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal Pages site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout latest LUTCalCh source
        uses: actions/checkout@v4
        with:
          repository: lqy306/LUTCalCh
          ref: master
          path: _lutcalch-source

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: _lutcalch-source/pnpm-lock.yaml

      - name: Build LUTCalCh for /LUTCalCh/
        working-directory: _lutcalch-source
        run: |
          pnpm install --frozen-lockfile
          BASE_PATH=/LUTCalCh/ pnpm build

      - name: Assemble Pages artifact
        run: |
          mkdir -p _pages-dist
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name _lutcalch-source ! -name _pages-dist -exec cp -a {} _pages-dist/ \;
          rm -rf _pages-dist/LUTCalCh
          mkdir -p _pages-dist/LUTCalCh
          cp -a _lutcalch-source/dist/public/. _pages-dist/LUTCalCh/
          touch _pages-dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
