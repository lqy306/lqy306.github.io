name: Sync LUTCalCh to GitHub Pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lutcalch-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout latest LUTCalCh source
        uses: actions/checkout@v4
        with:
          repository: lqy306/LUTCalCh
          ref: master
          path: _lutcalch-source
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: _lutcalch-source/pnpm-lock.yaml
      - name: Build LUTCalCh for the project Pages path
        working-directory: _lutcalch-source
        run: |
          pnpm install --frozen-lockfile
          BASE_PATH=/LUTCalCh/ pnpm build
      - name: Replace published LUTCalCh files
        run: |
          mkdir -p LUTCalCh
          rsync -a --delete _lutcalch-source/dist/public/ LUTCalCh/
          touch .nojekyll
      - name: Commit and publish when upstream changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LUTCalCh .nojekyll
          if git diff --cached --quiet; then
            echo "No LUTCalCh changes to publish."
          else
            git commit -m "chore: sync LUTCalCh from upstream"
            git push
          fi
